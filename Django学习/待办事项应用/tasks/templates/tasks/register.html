{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 待办事项</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>注册</h1>
            <p class="subtitle">创建你的账号</p>
        </div>

        <div class="add-card">
            <form method="POST">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-field">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.errors %}
                            <div class="error-msg">{{ field.errors.0 }}</div>
                        {% endif %}
                        {% if field.help_text %}
                            <div class="help-text">{{ field.help_text }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit">注册</button>
            </form>
        </div>

        <p class="auth-link">
            已有账号？<a href="{% url 'login' %}">立即登录</a>
        </p>
    </div>
</body>
</html>
